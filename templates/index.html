{{define "index"}}
<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Panadería de Santiago</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    {{template "nav" .}}
    <main>
    <h1>Panadería de Santiago</h1>
        <section class="breads">
            <h2>Nuestro pan</h2>
            <div class="bread-grid">
                {{range .}}
                <figure class="bread-box">
                    {{if .HasImage}}
                    <img src="/static/img/{{.Image}}" alt="{{.Name}}">
                    {{else}}
                    <div class="bread-placeholder">Foto próximamente</div>
                    {{end}}
                    <figcaption>{{.Name}}</figcaption>
                </figure>
                {{end}}
            </div>
        </section>
    </main>
    <footer>Panadería de Santiago - Founded 2022</footer>
</body>
</html>
{{end}}
